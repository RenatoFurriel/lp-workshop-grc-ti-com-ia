<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA — host hostil (simula GreatPages)</title>
<style>
  /* ---------------------------------------------------------------
     Host DELIBERADAMENTE hostil. Reproduz o que uma pagina de
     construtor faz com um bloco de HTML colado:
       - reset diferente (content-box) e fonte serifada global
       - img{width:100%!important} (o classico que estoura fotos)
       - estilos genericos em .btn / .wrap / .hero / h1 / ul / a
       - container com max-width
       - ancestral com transform (quebra position:fixed)
     Se o bloco sobreviver aqui, sobrevive no GreatPages.
     --------------------------------------------------------------- */
  *{box-sizing:content-box}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#dfe3e8;color:#123}
  img{width:100%!important;border:3px dashed #f0f!important}
  .btn{background:#0066cc!important;color:#fff;border-radius:30px;padding:30px;font-family:cursive}
  .wrap{max-width:300px!important;background:#ff0}
  .hero{background:#0f0!important;padding:80px}
  h1,h2,h3,h4{font-family:'Comic Sans MS',cursive;color:#f00;text-transform:lowercase;letter-spacing:.4em}
  p{max-width:14ch;color:#f0f}
  ul,ol{list-style:square inside;padding-left:60px}
  a{text-decoration:underline wavy #f00;color:#0f0}
  header{background:#000;padding:40px}
  footer{background:#600;color:#ff0}
  svg{width:50px!important;height:50px!important}
  .reveal{opacity:1}
  /* container do construtor + ancestral com transform */
  .gp-page{max-width:1170px;margin:0 auto;background:#fff;transform:translateZ(0)}
  .gp-label{font:12px/1.6 monospace;background:#123;color:#0f0;padding:8px 12px}
  #probe{position:fixed;top:0;right:0;z-index:9999999;background:#000;color:#0f0;
    font:11px/1.5 monospace;padding:10px;max-width:330px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="gp-label">HOST HOSTIL — container 1170px, ancestral com transform, reset e estilos conflitantes</div>

<!-- elementos do HOST que NAO podem ser afetados pelo bloco -->
<div class="gp-page">
  <div class="gp-label">elementos do HOST (devem permanecer feios/inalterados):</div>
  <header><h1>titulo do host</h1></header>
  <div class="wrap"><p>paragrafo do host</p>
    <a class="btn" href="#">botao do host</a>
    <ul><li>item do host</li></ul>
  </div>

  <div class="gp-label">↓↓↓ BLOCO COLADO ABAIXO ↓↓↓</div>
  <div id="slot"></div>
  <div class="gp-label">↑↑↑ FIM DO BLOCO ↑↑↑</div>

  <footer>rodape do host</footer>
</div>

<pre id="probe">carregando…</pre>

<script>
fetch('greatpages-block.html').then(function(r){return r.text();}).then(function(html){
  var slot=document.getElementById('slot');
  slot.innerHTML=html;
  // innerHTML nao executa <script>: recria como o construtor faz
  slot.querySelectorAll('script').forEach(function(old){
    var s=document.createElement('script');
    if(old.src){s.src=old.src;} else {s.textContent=old.textContent;}
    old.parentNode.replaceChild(s,old);
  });
  setTimeout(audit,2200);
});

function audit(){
  var d=document.documentElement, out=[];
  var R=document.getElementById('ix-ws3');
  out.push('root #ix-ws3 encontrado: '+!!R);
  out.push('overflow-x da pagina: '+(d.scrollWidth-d.clientWidth)+'px  '+(d.scrollWidth-d.clientWidth<=0?'OK':'FALHOU'));

  // 1. o host permaneceu intacto?
  var hostH1=document.querySelector('header h1');
  var f=getComputedStyle(hostH1).fontFamily;
  out.push('h1 do host ainda Comic Sans: '+(/Comic/i.test(f)?'OK':'FALHOU ('+f+')'));
  var hostP=document.querySelector('.wrap p');
  out.push('cor do p do host intacta: '+(getComputedStyle(hostP).color==='rgb(255, 0, 255)'?'OK':'FALHOU'));

  // 2. o bloco resistiu ao CSS do host?
  if(R){
    var h1=R.querySelector('h1');
    out.push('h1 do bloco usa Jost: '+(/Jost/.test(getComputedStyle(h1).fontFamily)?'OK':'FALHOU'));
    out.push('h1 do bloco em CAIXA ALTA: '+(getComputedStyle(h1).textTransform==='uppercase'?'OK':'FALHOU'));
    var btn=R.querySelector('.ix-btn');
    var bg=getComputedStyle(btn).backgroundColor;
    out.push('CTA laranja (nao azul do host): '+(bg==='rgb(255, 92, 0)'?'OK':'FALHOU ('+bg+')'));
    out.push('raio do CTA 4px (nao 30px): '+(getComputedStyle(btn).borderRadius==='4px'?'OK':'FALHOU'));
    var box=getComputedStyle(R).boxSizing;
    out.push('box-sizing border-box no bloco: '+(box==='border-box'?'OK':'FALHOU ('+box+')'));
    var img=R.querySelector('.ix-mentor-panel img');
    var bw=getComputedStyle(img).borderTopWidth;
    out.push('foto sem a borda do host: '+(bw==='0px'?'OK':'FALHOU ('+bw+')'));
    out.push('largura da foto <=400px: '+(img.getBoundingClientRect().width<=401?'OK ('+Math.round(img.getBoundingClientRect().width)+'px)':'FALHOU ('+Math.round(img.getBoundingClientRect().width)+'px)'));
    var svg=R.querySelector('.ix-stackfig svg');
    out.push('SVG do hero nao foi esmagado a 50px: '+(svg.getBoundingClientRect().width>100?'OK ('+Math.round(svg.getBoundingClientRect().width)+'px)':'FALHOU'));
    // header/footer do bloco nao podem herdar o fundo que o host da por tag
    var bh=getComputedStyle(R.querySelector('.ix-head')).backgroundColor;
    out.push('header do bloco nao ficou preto: '+(bh==='rgb(246, 243, 236)'?'OK':'FALHOU ('+bh+')'));
    var bf=getComputedStyle(R.querySelector('footer')).backgroundColor;
    out.push('footer do bloco nao ficou vinho: '+(bf==='rgb(246, 243, 236)'?'OK':'FALHOU ('+bf+')'));

    var li=R.querySelector('.ix-layer');
    out.push('camadas sem marcador de lista: '+(getComputedStyle(li.parentNode).listStyleType==='none'?'OK':'FALHOU'));

    // 3. conteudo visivel (a rede de seguranca do reveal funcionou?)
    var tot=R.querySelectorAll('.reveal').length, vis=0;
    R.querySelectorAll('.reveal').forEach(function(e){if(+getComputedStyle(e).opacity>0.9)vis++;});
    out.push('reveal visiveis: '+vis+'/'+tot+' '+(vis===tot?'OK':'FALHOU'));

    // 4. CTA aponta para o form com propagacao de utm
    var a=R.querySelector('a[data-form]');
    out.push('href do CTA: '+(a?a.getAttribute('href').slice(0,52):'-'));
    out.push('utm propagada: '+(a&&/utm_source=qa/.test(a.href)?'OK':'(sem utm na URL desta pagina)'));

    // 5. a faixa escura e unica?
    var dark=0;
    R.querySelectorAll('*').forEach(function(e){
      var c=getComputedStyle(e).backgroundColor;
      if(c==='rgb(20, 22, 24)'){dark++;}
    });
    out.push('blocos com fundo #141618: '+dark+' '+(dark===1?'OK (faixa unica)':'revisar'));

    // 6. CTA fixa mobile reancorada quando o transform quebra o fixed
    var bar=document.getElementById('ix-sticky');
    if(!bar){ out.push('sticky: AUSENTE'); }
    else if(getComputedStyle(bar).display==='none'){
      out.push('sticky: N/A com >=880px (oculta) - testar em 390px');
    } else {
      var okBar = bar.parentNode===document.body ||
                  Math.abs(bar.getBoundingClientRect().bottom-window.innerHeight)<5;
      out.push('sticky colada na viewport: '+(okBar?'OK':'FALHOU'));
    }
  }
  document.getElementById('probe').textContent=out.join('\n');
}
</script>
</body>
</html>
