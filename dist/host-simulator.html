<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA — host hostil (simula GreatPages)</title>
<style>
  /* ---------------------------------------------------------------
     Host DELIBERADAMENTE hostil. Reproduz o que um construtor de
     paginas faz com um bloco de HTML colado:
       - reset diferente (content-box) e fonte serifada global
       - img{width:100%!important} e svg{width:50px!important}
       - estilos genericos em .btn / .card / h1 / ul / a / footer
       - container com max-width
       - ancestral com transform (quebra position:fixed)
     Se o bloco sobreviver aqui, sobrevive no GreatPages.
     --------------------------------------------------------------- */
  *{box-sizing:content-box}
  body{margin:0;font-family:Georgia,'Times New Roman',serif;background:#dfe3e8;color:#123}
  img{width:100%!important;border:3px dashed #f0f!important}
  svg{width:50px!important;height:50px!important}
  .btn{background:#0066cc!important;color:#fff;border-radius:30px;padding:30px;font-family:cursive}
  .card{background:#ff0!important;border:6px solid #f0f!important}
  h1,h2,h3{font-family:'Comic Sans MS',cursive;color:#f00;text-transform:lowercase;letter-spacing:.4em}
  p{max-width:14ch;color:#f0f}
  ul,ol{list-style:square inside;padding-left:60px}
  a{text-decoration:underline wavy #f00;color:#0f0}
  header{background:#000;padding:40px}
  footer{background:#600!important;color:#ff0}
  section{background:#0f0!important;padding:70px!important}
  .gp-page{max-width:1170px;margin:0 auto;background:#fff;transform:translateZ(0)}
  .gp-label{font:12px/1.6 monospace;background:#123;color:#0f0;padding:8px 12px}
  #probe{position:fixed;top:0;right:0;z-index:9999999;background:#000;color:#0f0;
    font:11px/1.55 monospace;padding:10px;max-width:340px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="gp-label">HOST HOSTIL — container 1170px, ancestral com transform, reset e estilos conflitantes</div>

<div class="gp-page">
  <div class="gp-label">elementos do HOST (devem permanecer feios/inalterados):</div>
  <header><h1>titulo do host</h1></header>
  <div><p>paragrafo do host</p>
    <a class="btn" href="#">botao do host</a>
    <ul><li>item do host</li></ul>
  </div>

  <div class="gp-label">↓↓↓ BLOCO COLADO ABAIXO ↓↓↓</div>
  <div id="slot"></div>
  <div class="gp-label">↑↑↑ FIM DO BLOCO ↑↑↑</div>

  <footer>rodape do host</footer>
</div>

<pre id="probe">carregando…</pre>

<script>
// Um bloco so no projeto. As versoes A e B foram descartadas; se precisar do
// QA delas, o simulador com os tres perfis esta no historico do git (7dde696).
fetch('greatpages-block-c.html').then(function(r){return r.text();}).then(function(html){
  var slot=document.getElementById('slot');
  slot.innerHTML=html;
  // innerHTML nao executa <script>: recria como o construtor faz
  slot.querySelectorAll('script').forEach(function(old){
    var s=document.createElement('script');
    if(old.src){s.src=old.src;} else {s.textContent=old.textContent;}
    old.parentNode.replaceChild(s,old);
  });
  setTimeout(passear,2000);
});

// O reveal e disparado por rolagem. Auditar a pagina PARADA sempre acusava
// "reveal visiveis (4/26)" - a checagem media a pagina que ninguem rolou.
// Aqui o QA percorre a pagina inteira (em passos, como um usuario) e volta ao
// topo antes de auditar. Se algum bloco continuar invisivel depois disso, e bug
// de verdade.
function passear(){
  var y=0, voltas=0;
  var passo=function(){
    y+=180; window.scrollTo(0,y);
    // A altura e relida A CADA PASSO. Lendo uma vez no inicio, o passeio
    // encerrava cedo: as secoes com content-visibility:auto ainda estavam em
    // tamanho estimado e a pagina "media" menos do que mede de verdade -
    // resultado, o audit rodava com so o topo revelado (4/26).
    // O teto de 400 voltas e so trava contra pagina de altura infinita.
    if(y < document.documentElement.scrollHeight && ++voltas < 400){ setTimeout(passo,45); }
    // 1,6s antes de auditar: o reveal tem transicao de .8s mais atraso de ate
    // .34s, e a checagem le OPACIDADE. Com 500ms os ultimos elementos ainda
    // estavam a meio caminho e apareciam como "ocultos" - falso positivo.
    else { window.scrollTo(0,0); setTimeout(audit,1600); }
  };
  passo();
}

var LARANJA='rgb(242, 97, 1)', PRETO='rgb(13, 13, 13)', OSSO='rgb(240, 235, 225)';
var VERDE_HOST='rgb(0, 255, 0)', AMARELO_HOST='rgb(255, 255, 0)';

// O que e especifico do layout mora aqui; o resto do audit e generico.
//   dobra2Bg fica NULO porque a dobra 2 tem fundo em GRADIENTE - nao ha cor
//   solida para comparar, entao a checagem passa a ser "nao pegou o verde do
//   host", que e o que o teste realmente quer saber.
//   A logo nao e <svg> nem <img>: e um <span> com a logo em mascara CSS,
//   pintado pelo background-color. Efeito colateral util - passa ilesa por
//   img{width:100%!important} e svg{width:50px!important} do host.
var P={
  fundo:PRETO, raioCta:'6px', dobra2:'.ix-arq', dobra2Bg:null,
  card:'.ix-camada-p', icone:'.ix-camada-ico svg', lista:'.ix-pilha',
  marca:'.ix-marca .ix-logo', marcaProp:'backgroundColor', marcaMin:[40,8]
};

function audit(){
  var d=document.documentElement, out=[];
  var R=document.getElementById('ix-ws3');
  var ok=function(l,c,extra){out.push(l+': '+(c?'OK':'FALHOU')+(extra&&!c?' ('+extra+')':''));};

  out.push('root #ix-ws3: '+(R?'OK':'FALHOU'));
  ok('sem overflow horizontal', d.scrollWidth-d.clientWidth<=0, (d.scrollWidth-d.clientWidth)+'px');

  // 1. o host permaneceu intacto?
  ok('h1 do host segue Comic Sans',
     /Comic/i.test(getComputedStyle(document.querySelector('header h1')).fontFamily));
  ok('p do host segue magenta',
     getComputedStyle(document.querySelector('.gp-page > div > p')).color==='rgb(255, 0, 255)');
  ok('footer do host segue vinho',
     getComputedStyle(document.querySelector('.gp-page > footer')).backgroundColor==='rgb(102, 0, 0)');

  if(!R){ document.getElementById('probe').textContent=out.join('\n'); return; }

  // 2. o bloco resistiu ao CSS do host?
  var h1=R.querySelector('h1'), cs=getComputedStyle(h1);
  ok('h1 do bloco em Khand', /Khand/.test(cs.fontFamily), cs.fontFamily);
  ok('h1 do bloco em CAIXA ALTA', cs.textTransform==='uppercase');
  ok('corpo em Archivo',
     /Archivo/.test(getComputedStyle(R.querySelector('.ix-lede')).fontFamily));
  // :not(.ix-btn-mini) para pegar a CTA PRINCIPAL. Sem isso, abaixo de 880px o
  // primeiro .ix-btn do DOM e o botao compacto do topo, que tem raio proprio -
  // a checagem media o botao errado e reprovava por 1px.
  var btn=R.querySelector('.ix-btn:not(.ix-btn-mini)'), bcs=getComputedStyle(btn);
  ok('CTA laranja da marca', bcs.backgroundColor===LARANJA, bcs.backgroundColor);
  ok('CTA com o raio certo (nao 30px do host)',
     bcs.borderRadius===P.raioCta, bcs.borderRadius+' esperado '+P.raioCta);
  ok('box-sizing border-box no bloco', getComputedStyle(R).boxSizing==='border-box');
  var fundoReal=getComputedStyle(R).backgroundColor;
  ok('fundo da pagina correto', fundoReal===P.fundo, fundoReal);
  var sec2=getComputedStyle(R.querySelector(P.dobra2)).backgroundColor;
  if(P.dobra2Bg) ok('faixa da dobra 2 correta', sec2===P.dobra2Bg, sec2);
  else ok('dobra 2 manteve o proprio fundo', sec2!==VERDE_HOST, sec2);
  // contraste real do texto sobre o fundo desta versao
  var h1c=getComputedStyle(R.querySelector('h1')).color;
  ok('titulo contrasta com o fundo', h1c!==fundoReal, h1c+' vs '+fundoReal);
  var marcaEl=R.querySelector(P.marca);
  var simb=marcaEl?getComputedStyle(marcaEl)[P.marcaProp]:'AUSENTE';
  var marcaR=marcaEl?marcaEl.getBoundingClientRect():{width:0,height:0};
  ok('logo da marca visivel', simb!==fundoReal && simb!=='AUSENTE', simb);
  var mw=Math.round(marcaR.width), mh=Math.round(marcaR.height);
  ok('logo com tamanho util (nao esmagada pelo host)',
     mw>=P.marcaMin[0] && mh>=P.marcaMin[1] && !(mw===50 && mh===50),
     mw+'x'+mh+(mw===50&&mh===50?' - o host forcou svg{50px}':''));
  var neg=getComputedStyle(R.querySelector('.ix-selo .ix-neg-linha'));
  ok('check do selo nao foi preenchido', neg.fill==='none', neg.fill);
  ok('rodape do bloco = Preto Comando',
     getComputedStyle(R.querySelector('footer')).backgroundColor===PRETO);
  var card=R.querySelector(P.card);
  ok('card nao virou amarelo do host',
     getComputedStyle(card).backgroundColor!==AMARELO_HOST);
  ok('card sem a borda magenta do host', getComputedStyle(card).borderTopWidth==='0px');
  ok('secao nao virou verde do host', sec2!==VERDE_HOST);

  // 3. graficos nao esmagados pelo host
  var ico=R.querySelector(P.icone);
  ok('icone do card nao foi esmagado a 50px',
     ico.getBoundingClientRect().width>20 && ico.getBoundingClientRect().width<=60,
     Math.round(ico.getBoundingClientRect().width)+'px');
  var foto=R.querySelector('.ix-hero-foto i');
  ok('foto do hero com largura util', foto.getBoundingClientRect().width>120,
     Math.round(foto.getBoundingClientRect().width)+'px');
  var circ=R.querySelector('.ix-circulo');
  ok('circulo do mentor redondo',
     getComputedStyle(circ).borderRadius==='50%' &&
     Math.abs(circ.getBoundingClientRect().width-circ.getBoundingClientRect().height)<2);
  ok('camadas sem marcador de lista',
     getComputedStyle(R.querySelector(P.lista)).listStyleType==='none');

  // 4. conteudo visivel (rede de seguranca do reveal)
  // Mede a CLASSE, nao a opacidade. A classe e o que o codigo da pagina
  // controla; a opacidade e assunto da transicao de .8s, e com a aba em
  // segundo plano os timers do passeio sao estrangulados e a medida caia no
  // meio da animacao - falso positivo que ja apareceu duas vezes aqui.
  var revs=R.querySelectorAll('.reveal'), tot=revs.length, vis=0, meio=0;
  Array.prototype.forEach.call(revs, function(e){
    if(e.classList.contains('is-visible')){ vis++; if(+getComputedStyle(e).opacity<=0.9) meio++; }
  });
  // Pagina OCULTA nao roda requestAnimationFrame nem entrega
  // IntersectionObserver, entao a varredura do reveal fica parada e a medida
  // nao diz nada sobre a pagina. So audita com a aba na frente.
  if(document.visibilityState!=='visible'){
    out.push('reveal: N/A - aba em segundo plano (rAF pausado). Traga a aba para a frente e recarregue.');
  } else {
    ok('reveal armados ('+vis+'/'+tot+')', vis===tot);
    if(meio) out.push('  (' + meio + ' ainda em transicao no momento da medida - normal)');
  }

  // 5. atribuicao de campanha
  var a=R.querySelector('a[data-form]');
  out.push('href do CTA: '+a.getAttribute('href').slice(0,46));
  ok('utm propagada para o form', /utm_source=qa/.test(a.href));

  // 6. CTA fixa mobile
  var bar=document.getElementById('ix-sticky');
  if(!bar) out.push('sticky: AUSENTE');
  else if(getComputedStyle(bar).display==='none')
    out.push('sticky: N/A com >=880px - testar em 390px');
  else {
    // Nao basta ter sido reancorada no body: como o CSS do bloco e escopado em
    // #ix-ws3, sair da raiz faz a barra perder TODAS as regras. Verifica o que
    // interessa - colada na viewport E ainda estilizada.
    // Mede no estado ABERTO: fechada, a barra esta deslocada por
    // transform:translateY(120%) e o bottom nao diz nada sobre o ancoramento.
    // transition:none antes de abrir - senao a medida cai no meio dos 300ms da
    // transicao e le o deslocamento antigo.
    var jaAberta=bar.classList.contains('is-visible');
    var trAntes=bar.style.transition;
    bar.style.transition='none';
    if(!jaAberta) bar.classList.add('is-visible');
    var bcs2=getComputedStyle(bar), brect=bar.getBoundingClientRect();
    if(!jaAberta) bar.classList.remove('is-visible');
    bar.style.transition=trAntes;
    ok('sticky colada na viewport',
       Math.abs(brect.bottom-window.innerHeight)<5,
       'bottom '+Math.round(brect.bottom)+' vs '+window.innerHeight);
    ok('sticky manteve o estilo fora da raiz',
       bcs2.position==='fixed' && bcs2.backgroundColor!=='rgba(0, 0, 0, 0)',
       bcs2.position+' / '+bcs2.backgroundColor);
  }

  var falhas=out.filter(function(l){return /FALHOU/.test(l)}).length;
  out.unshift(falhas? '>>> '+falhas+' FALHA(S)' : '>>> TUDO OK');
  document.getElementById('probe').textContent=out.join('\n');
}
</script>
</body>
</html>
